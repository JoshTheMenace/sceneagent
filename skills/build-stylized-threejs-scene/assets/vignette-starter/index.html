<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A small stylized Three.js vignette." />
    <title>Stylized Vignette</title>
  </head>
  <body>
    <canvas id="view" tabindex="0" aria-label="Explore the vignette" aria-describedby="prompt" aria-keyshortcuts="Enter Space W A S D ArrowUp ArrowDown ArrowLeft ArrowRight E R Escape"></canvas>
    <div id="hud" aria-live="polite">
      <p id="prompt">Click to explore · WASD to move · E to interact · Esc to pause</p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
